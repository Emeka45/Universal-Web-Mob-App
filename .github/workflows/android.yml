name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build optimized debug APKs
        run: gradle assembleDebug -PsplitApks=true --no-daemon

      - name: Upload optimized debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-web-mob-debug-split
          path: app/build/outputs/apk/debug/*-*.apk

      - name: Build optimized release APKs
        run: gradle assembleRelease -PsplitApks=true --no-daemon

      - name: Build Android App Bundle
        run: gradle bundleRelease --no-daemon

      - name: Upload optimized release APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-web-mob-release-split
          path: app/build/outputs/apk/release/*-*.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-web-mob-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
